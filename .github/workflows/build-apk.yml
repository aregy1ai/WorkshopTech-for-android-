name: 🔨 Build & Release WorkshopTech APK

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: '17'
  JAVA_DISTRIB: 'temurin'

jobs:
  # ─────────────────────────────────────────────────────────────────
  run-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  build-debug:
    name: 🐛 Build Debug APK
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run lint checks
        run: ./gradlew :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename Debug APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/workshoptech-debug-${SHORT_SHA}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workshoptech-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/workshoptech-debug-*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build & Sign Release APK
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: >
      (github.event_name != 'pull_request') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Signing: decode keystore from repository secret ──────────
      - name: Decode Keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.jks
          echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV

      - name: Build Release APK (signed)
        if: env.KEYSTORE_EXISTS == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Build Release APK (unsigned — no keystore configured)
        if: env.KEYSTORE_EXISTS != 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.jks

      - name: Rename Release APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK_SRC" app/build/outputs/apk/release/workshoptech-release-${SHORT_SHA}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: workshoptech-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/workshoptech-release-*.apk
          retention-days: 90

      # ── GitHub Release (only on v* tags) ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/workshoptech-release-*.apk
          generate_release_notes: true
          body: |
            ## 🚀 WorkshopTech ${{ github.ref_name }}

            ### كيفية التثبيت
            1. نزّل ملف `workshoptech-release-*.apk`
            2. فعّل "التثبيت من مصادر غير معروفة" في إعدادات هاتفك
            3. ثبّت التطبيق وابدأ الاستخدام

            ### المتطلبات
            - Android 7.0 (API 24) أو أحدث
            - مساحة 100 ميغابايت على الأقل
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
