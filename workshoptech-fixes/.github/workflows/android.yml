name: WorkshopTech CI/CD — Android 15

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIB:  'temurin'
  GRADLE_OPTS:   '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  # ── 1. Static analysis ────────────────────────────────────────────────────
  lint:
    name: Lint & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Lint
        working-directory: workshoptech-fixes
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ github.sha }}
          path: workshoptech-fixes/app/build/reports/lint-results*.html
          retention-days: 7

  # ── 2. Unit tests (JVM — fast, no device needed) ──────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Run unit tests (JVM + Robolectric)
        working-directory: workshoptech-fixes
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ github.sha }}
          path: workshoptech-fixes/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Robolectric XML (for CI test summary)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-xml-${{ github.sha }}
          path: workshoptech-fixes/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14

  # ── 3. Instrumented tests (Android emulator — DAOs, migrations, Compose) ─
  instrumented-test:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      # Enable KVM hardware acceleration for faster emulator boot
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: test_device
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: workshoptech-fixes
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results-${{ github.sha }}
          path: |
            workshoptech-fixes/app/build/reports/androidTests/
            workshoptech-fixes/app/build/outputs/androidTest-results/
          retention-days: 14

  # ── 4. Debug build ────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: instrumented-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Build debug APK
        working-directory: workshoptech-fixes
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: workshoptech-fixes/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ── 5. Release build (main branch only) ──────────────────────────────────
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-debug
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIB }}
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > workshoptech-fixes/keystore.jks

      - name: Build release AAB
        working-directory: workshoptech-fixes
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.sha }}
          path: workshoptech-fixes/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f workshoptech-fixes/keystore.jks
